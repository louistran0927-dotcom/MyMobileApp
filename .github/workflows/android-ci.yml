name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Set up Node.js for React Native JavaScript dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 2. Set up Java (JDK 17 is required for modern React Native)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Cache Gradle dependencies and wrapper to speed up builds
      - name: Cache Gradle Wrapper and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Install Android SDK & Ensure NDK is available
      - name: Install Android SDK Components & NDK
        uses: android-actions/setup-android@v3

      - name: Install specific NDK version (Matching your gradle.properties)
        run: |
          sdkmanager "ndk;26.1.10909125" # Update this version to match your project's exact NDK requirement

      # 5. Install JS dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6. Build Android Release APK / Bundle
      - name: Build Android Release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
