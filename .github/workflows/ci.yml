name: CI / React Native Build & Test

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Jest Tests
        run: npm test -- --ci --coverage

      - name: Build JS Bundle (Hermes Verification)
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Grant Execute Permission for Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Android Debug APK (Gradle verification)
        env:
          ORG_GRADLE_PROJECT_hermesEnabled: "true"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Build Artifacts (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
