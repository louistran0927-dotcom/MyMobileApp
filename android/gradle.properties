# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# React Native / New Architecture & Hermes Settings
newArchitectureEnabled=false
hermesEnabled=true

# NDK Version Pinning (Must match what your CI installs or what your React Native version expects)
android.ndkVersion=26.1.10909125

# Target Architectures for React Native (speeds up local builds, or supports full distribution in CI)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
