apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the primary configuration block for React Native.
 * The react plugin automatically handles packaging JS assets, source maps,
 * and Hermes binary linkages based on your project properties.
 */
react {
    // Autolinking and asset paths
    root = file("../")
    cliFile = file("../node_modules/@react-native-community/cli/build/bin.js")
    bundleCommand = "ram-bundle"
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntryPoint')"] ? file("../index.js") : file("../index.js"))
    enableHermes = true
}

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
    namespace "com.yourapp" // Replace with your exact app namespace/package ID
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.yourapp"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // NDK Pinning aligned with gradle.properties
        ndkVersion rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : "26.1.10909125"

        ndk {
            abiFilters (*reactNativeArchitectures())
        }
    }

    signingConfigs {
        release {
            if (System.getenv("MYAPP_UPLOAD_STORE_FILE") != null) {
                storeFile file(System.getenv("MYAPP_UPLOAD_STORE_FILE"))
                storePassword System.getenv("MYAPP_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("MYAPP_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("MYAPP_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The React Native Gradle Plugin automatically handles hermes-android when enabled
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
