apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Hermes is enabled via gradle.properties, but can be controlled here too
    enableHermes = true
}

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
    namespace "com.yourapp" // Replace with your actual package namespace
    compileSdkVersion 34    // Match your project's target SDK requirement

    defaultConfig {
        applicationId "com.yourapp"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // Explicit NDK configuration mapping to gradle.properties
        ndkVersion rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : (project.hasProperty("android.ndkVersion") ? project.property("android.ndkVersion") : "26.1.10909125")

        ndk {
            abiFilters (*reactNativeArchitectures())
        }
    }

    signingConfigs {
        release {
            // Keep your release signing configs here or via environment variables
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The React Native Gradle plugin automatically injects hermes-android when hermesEnabled = true
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
